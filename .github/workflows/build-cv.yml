name: Build CV

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and validate CV
        uses: ./.github/actions/build-cv

      - name: Upload CV
        uses: actions/upload-artifact@v7
        with:
          name: cv
          path: |
            cv.pdf
            cv-de.pdf
            cv-no-picture.pdf
            cv-de-no-picture.pdf
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: cloudflare-deploy
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download built CV
        uses: actions/download-artifact@v8
        with:
          name: cv
          path: public

      - name: Prepare Pages site
        run: cp cloudflare/_redirects public/_redirects

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo '::error::Set the CLOUDFLARE_PAGES_PROJECT environment variable'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }

      - name: Deploy CV
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public
            --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
            --branch="${{ vars.CLOUDFLARE_PAGES_BRANCH || 'main' }}"
