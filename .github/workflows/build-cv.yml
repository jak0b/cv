name: Build CV

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and validate CV
        uses: ./.github/actions/build-cv

      - name: Upload CV
        uses: actions/upload-artifact@v7
        with:
          name: cv
          path: |
            cv.pdf
            cv-de.pdf
            cv-no-picture.pdf
            cv-de-no-picture.pdf
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      github.event_name == 'release' ||
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    environment: cloudflare-deploy
    concurrency:
      group: cloudflare-pages-${{ github.event_name == 'release' && 'production' || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download built CV
        uses: actions/download-artifact@v8
        with:
          name: cv
          path: public

      - name: Prepare Pages site
        run: cp cloudflare/_redirects public/_redirects

      - name: Select Pages branch
        id: pages_branch
        env:
          PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH || 'main' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'release' ]]; then
            echo "branch=$PRODUCTION_BRANCH" >> "$GITHUB_OUTPUT"
          else
            short_sha=$(git rev-parse --short "$GITHUB_SHA")
            echo "branch=$short_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo '::error::Set the CLOUDFLARE_PAGES_PROJECT environment variable'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }

      - name: Deploy CV
        id: deploy_cv
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public
            --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
            --branch="${{ steps.pages_branch.outputs.branch }}"
            --commit-hash="${{ github.sha }}"

      - name: Print CV deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_cv.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy_cv.outputs.pages-deployment-alias-url }}
        run: |
          cv_base_url="${DEPLOYMENT_ALIAS_URL:-$DEPLOYMENT_URL}"
          if [[ -z "$cv_base_url" ]]; then
            echo '::error::Wrangler did not return a deployment URL'
            exit 1
          fi
          cv_base_url="${cv_base_url%/}"
          echo "CV deployment: $cv_base_url"
          echo "English CV: $cv_base_url/cv.pdf"
          {
            echo '## CV deployment'
            echo
            echo "[Open deployment]($cv_base_url)"
            echo
            echo "[English CV]($cv_base_url/cv.pdf)"
          } >> "$GITHUB_STEP_SUMMARY"
