name: Build CV

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.14.2'
          cache-dependency-path: '**/*.typ'

      - name: Configure font directory
        run: echo "TYPST_FONT_PATHS=$RUNNER_TEMP/fonts" >> "$GITHUB_ENV"

      - name: Install Iosevka Nerd Fonts
        run: |
          mkdir -p "$TYPST_FONT_PATHS"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/Iosevka.tar.xz" \
            https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/Iosevka.tar.xz
          tar -xJf "$RUNNER_TEMP/Iosevka.tar.xz" -C "$TYPST_FONT_PATHS"

      - name: Install Font Awesome icons
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/fontawesome.zip" \
            https://github.com/FortAwesome/Font-Awesome/releases/download/7.0.1/fontawesome-free-7.0.1-desktop.zip
          unzip -q "$RUNNER_TEMP/fontawesome.zip" '*.otf' -d "$TYPST_FONT_PATHS"

      - name: Verify required fonts
        run: |
          typst fonts > "$RUNNER_TEMP/fonts.txt"
          grep -Fx 'Iosevka NF' "$RUNNER_TEMP/fonts.txt"
          grep -Fx 'Iosevka NFP Medium Obl' "$RUNNER_TEMP/fonts.txt"
          grep -Fx 'Font Awesome 7 Free' "$RUNNER_TEMP/fonts.txt"
          grep -Fx 'Font Awesome 7 Brands' "$RUNNER_TEMP/fonts.txt"

      - name: Build PDFs
        run: |
          typst compile cv.typ cv.pdf
          typst compile cv-de.typ cv-de.pdf

      - name: Upload CV
        uses: actions/upload-artifact@v7
        with:
          name: cv
          path: |
            cv.pdf
            cv-de.pdf
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: cloudflare-deploy
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download built CV
        uses: actions/download-artifact@v8
        with:
          name: cv
          path: public

      - name: Prepare Pages site
        run: cp cloudflare/_redirects public/_redirects

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo '::error::Set the CLOUDFLARE_PAGES_PROJECT environment variable'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }

      - name: Deploy CV
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public
            --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
            --branch="${{ vars.CLOUDFLARE_PAGES_BRANCH || 'main' }}"
