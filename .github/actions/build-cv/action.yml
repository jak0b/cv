name: Build and validate CV
description: Install pinned Typst and fonts and build both one-page A4 PDFs
runs:
  using: composite
  steps:
    - name: Test dependency updater
      shell: bash
      run: python3 -B -m unittest discover -s tests -v

    - name: Read dependency versions
      id: versions
      shell: bash
      run: |
        jq -r 'to_entries[] | "\(.key)=\(.value)"' .github/dependencies.json >> "$GITHUB_OUTPUT"

    - name: Install Typst
      uses: typst-community/setup-typst@v5
      with:
        typst-version: ${{ steps.versions.outputs.typst }}
        cache-dependency-path: cv-template.typ

    - name: Configure font directory
      shell: bash
      run: echo "TYPST_FONT_PATHS=$RUNNER_TEMP/fonts" >> "$GITHUB_ENV"

    - name: Install fonts
      shell: bash
      env:
        NERD_FONTS_VERSION: ${{ steps.versions.outputs.nerd-fonts }}
        FONT_AWESOME_VERSION: ${{ steps.versions.outputs.font-awesome }}
      run: |
        mkdir -p "$TYPST_FONT_PATHS"
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/Iosevka.tar.xz" \
          "https://github.com/ryanoasis/nerd-fonts/releases/download/v${NERD_FONTS_VERSION}/Iosevka.tar.xz"
        tar -xJf "$RUNNER_TEMP/Iosevka.tar.xz" -C "$TYPST_FONT_PATHS"
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/fontawesome.zip" \
          "https://github.com/FortAwesome/Font-Awesome/releases/download/${FONT_AWESOME_VERSION}/fontawesome-free-${FONT_AWESOME_VERSION}-desktop.zip"
        unzip -q "$RUNNER_TEMP/fontawesome.zip" '*.otf' -d "$TYPST_FONT_PATHS"

    - name: Verify required fonts
      shell: bash
      run: |
        typst fonts > "$RUNNER_TEMP/fonts.txt"
        grep -Fx 'Iosevka NF' "$RUNNER_TEMP/fonts.txt"
        grep -Fx 'Iosevka NFP Medium Obl' "$RUNNER_TEMP/fonts.txt"
        grep -Fx 'Font Awesome 7 Free' "$RUNNER_TEMP/fonts.txt"
        grep -Fx 'Font Awesome 7 Brands' "$RUNNER_TEMP/fonts.txt"

    - name: Build PDFs
      shell: bash
      run: |
        typst compile cv.typ cv.pdf
        typst compile cv-de.typ cv-de.pdf

    - name: Verify one A4 page per PDF
      shell: bash
      run: |
        if ! command -v pdfinfo >/dev/null; then
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
        fi
        for pdf in cv.pdf cv-de.pdf; do
          pdfinfo "$pdf" | tee "$RUNNER_TEMP/pdfinfo.txt"
          grep -Eq '^Pages: +1$' "$RUNNER_TEMP/pdfinfo.txt"
          grep -Eq '^Page size: .*\(A4\)$' "$RUNNER_TEMP/pdfinfo.txt"
        done
